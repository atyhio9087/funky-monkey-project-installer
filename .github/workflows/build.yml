name: Build installers

# Builds the Windows, macOS, and Linux installers on their native platforms
# (electron-builder can't cross-compile a real .dmg or code-signed .exe from
# a different OS). Run manually from the Actions tab for a one-off build
# (artifacts only), or push a tag like "v1.0.4" to also publish a GitHub
# Release with the installers attached as permanent download links — that's
# what the README points to.
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Don't cancel the other OS builds just because one platform fails —
      # each is independent, and we still want e.g. the Windows/Linux
      # artifacts even if macOS needs another pass.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Never attempt to auto-discover a code-signing identity on any OS —
      # these are unsigned local-use builds by design (see README).
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

  release:
    # Only publish a Release for an actual version tag — a manual
    # workflow_dispatch run just produces the per-OS build artifacts above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Collect installer files
        run: |
          mkdir -p release-files
          find installers -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release-files/ \;
          ls -la release-files
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
